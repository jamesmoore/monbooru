app-id: io.github.monbooru.Monbooru
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: monbooru-run

finish-args:
  - --share=network
  - --filesystem=home
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=xdg-config/autostart:create

modules:
  - name: onnxruntime
    buildsystem: simple
    build-commands:
      - install -Dm644 lib/libonnxruntime.so.1.21.0 /app/bin/libonnxruntime.so
      - install -Dm644 -t /app/share/licenses/onnxruntime LICENSE ThirdPartyNotices.txt
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-x64-1.21.0.tgz
        sha256: 7485c7e7aac6501b27e353dcbe068e45c61ab51fbaf598d13970dfae669d20bf
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-aarch64-1.21.0.tgz
        sha256: 4508084bde1232ee1ab4b6fad2155be0ea2ccab1c1aae9910ddb3fb68a60805e

  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/ffmpeg /app/bin/ffmpeg
      - install -Dm755 bin/ffprobe /app/bin/ffprobe
      - install -Dm644 -t /app/share/licenses/ffmpeg licenses/*
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/monbooru/ffmpeg-builds/releases/download/v8.1.3-mb1/ffmpeg-8.1.3-mb1-linux64.tar.xz
        sha256: 2fc794c828a3f61836605f09f97bc9e59f906a52b971c6c170aaf480be63a216
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/monbooru/ffmpeg-builds/releases/download/v8.1.3-mb1/ffmpeg-8.1.3-mb1-linuxarm64.tar.xz
        sha256: 2decca9ea2a50b25c138ccc9faa45bf9d1dc92ef176ccc5d58185a3503805d9e

  - name: monbooru
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      build-args:
        - --share=network
    build-commands:
      - |
        set -eu
        export GOTOOLCHAIN=go$(awk '/^go /{print $2; exit}' go.mod)
        . ./packaging/release-env.sh
        CGO_ENABLED=1 go build -tags tagger \
          -ldflags="-s -w $LDFLAGS -X '$MOD.Package=flatpak'" \
          -o monbooru ./cmd/monbooru
        # The AppStream release entry is written from VERSION.md and the newest
        # changelog heading, so a release has one version to bump, not two.
        HEADING=$(awk '/^## /{print $2; exit}' CHANGELOG.md)
        RELDATE=$(awk '/^## /{print $4; exit}' CHANGELOG.md)
        [ "$HEADING" = "[$VERSION]" ] || {
          echo "CHANGELOG.md's newest entry is $HEADING, VERSION.md says $VERSION" >&2
          exit 1
        }
        RELEASE="<release version=\"${VERSION#v}\" date=\"$RELDATE\"/>"
        sed "s|<!--RELEASE-->|$RELEASE|" \
          packaging/flatpak/io.github.monbooru.Monbooru.metainfo.xml > metainfo.xml
        grep -qF "$RELEASE" metainfo.xml || {
          echo "the metainfo has no <!--RELEASE--> marker to fill" >&2
          exit 1
        }
      - install -Dm755 monbooru /app/bin/monbooru
      - install -Dm755 packaging/flatpak/monbooru-run /app/bin/monbooru-run
      - install -Dm644 packaging/flatpak/io.github.monbooru.Monbooru.desktop /app/share/applications/io.github.monbooru.Monbooru.desktop
      - install -Dm644 metainfo.xml /app/share/metainfo/io.github.monbooru.Monbooru.metainfo.xml
      - install -Dm644 packaging/icons/monbooru-64.png /app/share/icons/hicolor/64x64/apps/io.github.monbooru.Monbooru.png
      - install -Dm644 packaging/icons/monbooru-128.png /app/share/icons/hicolor/128x128/apps/io.github.monbooru.Monbooru.png
      - install -Dm644 packaging/icons/monbooru-256.png /app/share/icons/hicolor/256x256/apps/io.github.monbooru.Monbooru.png
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - monbooru
          - perf
          - tests
          - project
          - dist
          - stage
          - tools
          - test-results
          - .playwright-mcp
