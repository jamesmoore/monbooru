{{define "partials/related_images.html"}}
{{if .Images}}
<div class="related-images">
  <h3>Images with similar tags <a class="related-images-more" href="/?q=similar:{{.SourceID}}">[more like this]</a></h3>
  <div class="related-mini-grid">
    {{range .Images}}
    <a href="/images/{{.ID}}?ref={{$.SourceID}}{{$.BackKVQS}}"
       class="related-mini-card" title="Image {{.ID}}">
      <img src="/thumbnails/{{$.ActiveGallery}}/{{.ID}}.jpg" alt="image {{.ID}}" loading="lazy"
           onerror="this.parentElement.innerHTML='<span class=thumb-fail title=&quot;preview unavailable&quot;>?</span>'">
      {{template "manga_pill" .}}
    </a>
    {{end}}
  </div>
</div>
{{end}}
{{end}}
