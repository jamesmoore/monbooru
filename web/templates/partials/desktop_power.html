{{define "partials/desktop_power.html"}}<div id="desktop-power" class="desktop-power" hx-get="/internal/desktop-power" hx-trigger="every 5s [!confirmOpen()]" hx-swap="outerHTML">
  <form method="post" action="/settings/restart"
        hx-confirm="Restart monbooru?" data-confirm-ok="Restart"
        {{with .Warning}}data-confirm-danger="{{.}}"{{end}}>
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    <button type="submit">Restart monbooru</button>
  </form>
  <form method="post" action="/settings/quit" class="desktop-quit"
        hx-confirm="Stop monbooru?" data-confirm-ok="Stop"
        {{with .Warning}}data-confirm-danger="{{.}}"{{end}}>
    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
    <button type="submit" class="btn-danger">Stop monbooru</button>
  </form>
</div>{{end}}
