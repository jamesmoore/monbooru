{{define "partials/source_remove_form.html"}}
<form method="POST" action="/images/{{.ImageID}}/{{.Action}}"
      hx-post="/images/{{.ImageID}}/{{.Action}}" hx-target="#detail-flash"
{{- if .Confirm}}
      hx-confirm="{{.Confirm}}"{{with .Danger}}
      data-confirm-danger="{{.}}"{{end}}
      data-confirm-ok="Remove"{{end}}
      style="display:inline">
  <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
  {{range $k, $v := .Fields}}<input type="hidden" name="{{$k}}" value="{{$v}}">
  {{end}}<button type="submit" class="btn-link-accent" title="{{.Title}}">{{or .Label "[×]"}}</button>
</form>
{{end}}
